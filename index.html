<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TG Music Bots Hub</title>
    <!-- Telegram Library -->
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-color: #17212b;
            --text-color: #f5f5f5;
            --card-bg: #24303f;
            --accent-color: #2481cc;
            --hint-color: #708499;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }
        .section {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: var(--accent-color);
            border-bottom: 1px solid var(--hint-color);
            padding-bottom: 8px;
        }
        /* Feature 1: User Profile */
        .user-card {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .avatar-container {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.4rem;
            color: white;
            overflow: hidden;
        }
        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .user-info p {
            margin: 4px 0;
        }
        /* Feature 2: Bot List */
        .bot-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .bot-item:last-child {
            border-bottom: none;
        }
        .bot-details {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .bot-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
        }
        .btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
        }
        /* Feature 3: Owner */
        .owner-card {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
    </style>
</head>
<body>

    <!-- Feature 1: User Details -->
    <div class="card" id="user-card">
        <h3>👤 User Details (You)</h3>
        
        <!-- 🌟 नया प्रोफाइल फोटो का सेक्शन -->
        <div class="avatar-container">
            <!-- शुरू में एक डिफ़ॉल्ट यूजर इमेज लोड होगी -->
            <img id="u-avatar" class="user-avatar" src="https://cloudflare.com" alt="User DP">
        </div>

        <p><span class="bold">Name:</span> <span id="u-name">Loading...</span></p>
        <p><span class="bold">Username:</span> <span id="u-username">Loading...</span></p>
        <p><span class="bold">ID:</span> <span id="u-id">Loading...</span></p>
        <p><span class="bold">Language:</span> <span id="u-lang">Loading...</span></p>
    </div>

    <!-- FEATURE 2: BOT LIST -->
    <div class="section">
        <h2>🤖 Music Bots List</h2>
        <div id="bots-container"></div>
    </div>

    <!-- FEATURE 3: OWNER DETAILS -->
    <div class="section">
        <h2>👑 Developer & Support</h2>
        <div class="owner-card">
            <p><strong>Owner:</strong> Niraj</p>
            <p><strong>Username:</strong> @Comeback_009</p>
            <a href="https://t.me/Sangeet_Stream" class="btn" style="text-align: center;">Contact Support</a>
        </div>
    </div>

    <script>
        function initTelegramApp() {
            // Telegram WebApp Object Check
            const tg = window.Telegram?.WebApp;

            if (tg) {
                tg.ready(); 
                tg.expand(); 

                // Data fetch karne ki koshish karein
                const user = tg.initDataUnsafe?.user; 

                if (user && user.id) {
                    // Agar user mil gaya toh loading hatao aur details dikhao
                    document.getElementById('u-name').innerText = `${user.first_name} ${user.last_name || ''}`;
                    document.getElementById('u-username').innerText = user.username ? `@${user.username}` : 'No Username';
                    document.getElementById('u-id').innerText = user.id;
                    document.getElementById('u-lang').innerText = user.language_code || 'en';
                    
                    // 🌟 अगर टेलीग्राम यूजर की फोटो का यूआरएल देता है तो उसे अपडेट करें
                    if (user.photo_url) {
                        document.getElementById('u-avatar').src = user.photo_url;
                    }
                    
                    // Interval ko rokne ke liye
                    clearInterval(checkInterval);
                }
            }
        }

        // Agar data slow load ho raha hai, toh yeh har 500ms (0.5 second) me check karega
        const checkInterval = setInterval(initTelegramApp, 500);

        // Max 5 seconds tak check karega, agar fir bhi nahi mila toh Browser mode default data dikhayega
        setTimeout(() => {
            clearInterval(checkInterval);
            if (document.getElementById('u-id').innerText === "Loading...") {
                document.getElementById('u-name').innerText = "Web Browser Mode";
                document.getElementById('u-username').innerText = "@not_inside_tg";
                document.getElementById('u-id').innerText = "Offline_ID_101";
                document.getElementById('u-lang').innerText = "en";
                // ब्राउज़र मोड में एक फूल वाली डिफ़ॉल्ट इमेज दिखेगी
                document.getElementById('u-avatar').src = "https://cloudflare.com";
            }
        }, 5000);
        <script>

        // 2. Bots Data List
        const botsData = [
            { name: "laado Music Bot", username: "laado_musicbot", img: "https://unsplash.com" },
            { name: "Spotify", username: "spotifysave_bot", img: "https://unsplash.com" },
            { name: "YouTube music", username: "yt_audio_bot", img: "https://unsplash.com" },
        ];

        // Render Bots
        const container = document.getElementById('bots-container');
        botsData.forEach(bot => {
            const item = document.createElement('div');
            item.className = 'bot-item';
            item.innerHTML = `
                <div class="bot-details">
                    <img src="${bot.img}" class="bot-avatar">
                    <div>
                        <div style="font-weight:bold;">${bot.name}</div>
                        <div style="color:var(--hint-color); font-size:0.85rem;">@${bot.username}</div>
                    </div>
                </div>
                <button class="btn" onclick="openBot('${bot.username}')">Open</button>
            `;
            container.appendChild(item);
        });

        function openBot(username) {
            if (window.Telegram?.WebApp) {
                window.Telegram.WebApp.openTelegramLink(`https://t.me{username}`);
            } else {
                window.open(`https://t.me{username}`, '_blank');
            }
        }
    </script>
</body>
</html>
