<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TG Music Bots Hub</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-color: #17212b;
            --text-color: #f5f5f5;
            --card-bg: #24303f;
            --accent-color: #2481cc;
            --hint-color: #708499;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }
        .section {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: var(--accent-color);
            border-bottom: 1px solid var(--hint-color);
            padding-bottom: 8px;
        }
        /* Feature 1: User Profile */
        .user-card {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--hint-color);
            object-fit: cover;
        }
        .user-info p {
            margin: 4px 0;
        }
        /* Feature 2: Search & Bot List */
        .search-bar {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--hint-color);
            background: var(--bg-color);
            color: var(--text-color);
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        .bot-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .bot-item:last-child {
            border-bottom: none;
        }
        .bot-details {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
        }
        /* Feature 3: Owner */
        .owner-card {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
    </style>
</head>
<body>

    <!-- FEATURE 1: TG USER DETAILS -->
    <div class="section">
        <h2>🎵 Welcome User</h2>
        <div class="user-card">
            <img id="user-photo" class="avatar" src="https://placeholder.com" alt="Profile">
            <div class="user-info">
                <p><strong>Name:</strong> <span id="user-name">Loading...</span></p>
                <p><strong>Username:</strong> <span id="user-username">@loading</span></p>
            </div>
        </div>
    </div>

    <!-- FEATURE 2: BOT LIST WITH SEARCH -->
    <div class="section">
        <h2>🤖 Music Bots List</h2>
        <input type="text" id="search-input" class="search-bar" placeholder="Search bots here...">
        <div id="bots-container">
            <!-- Bots dynamically add honge -->
        </div>
    </div>

    <!-- FEATURE 3: OWNER DETAILS -->
    <div class="section">
        <h2>👑 Developer & Support</h2>
        <div class="owner-card">
            <p><strong>Owner:</strong> Niraj</p>
            <p><strong>Username:</strong> @Comeback_009</p>
            <a href="https://t.me/Sangeet_Stream" class="btn" style="text-align: center;">Support</a>
        </div>
    </div>

    <script>
        // Telegram Web App initialize karna
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Full screen app open karne ke liye

        // 1. Automatic User Details Fetch
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('user-name').innerText = `${user.first_name} ${user.last_name || ''}`;
            document.getElementById('user-username').innerText = user.username ? `@${user.username}` : 'No Username';
            if (user.photo_url) {
                document.getElementById('user-photo').src = user.photo_url;
            }
        } else {
            // Browser testing ke liye dummy data
            document.getElementById('user-name').innerText = "Guest User";
            document.getElementById('user-username').innerText = "@guest";
        }

        // 2. Bots Data List (Aap isme apne bots add kar sakte hain)
        const botsData = [
            { name: "˹ʟᴀᴀᴅᴏ ꭙ ᴍᴜsɪᴄ˼ ♪", username: "laado_musicbot", img: "https://image-link.edgeone.app/1780443606689-jovnxm.jpg" },
            { name: "𝗣𝗅𝗮𝘺𝘦𝘳𝘱𝙧𝘰 ꭙ 𝗠𝑢𝑠𝑖𝑐 ♪", username: "PlayerPro_MusicBot", img: "https://placeholder.com" },
            { name: "˹ᴋᴜᴋᴜ ꭙ ᴍᴜꜱɪᴄ˼ ♪", username: "Kuku_MusicBot", img: "https://placeholder.com" },
        ];

        const container = document.getElementById('bots-container');
        const searchInput = document.getElementById('search-input');

        // Function: Bot list ko screen par render karna
        function renderBots(filterText = "") {
            container.innerHTML = "";
            const filtered = botsData.filter(bot => 
                bot.name.toLowerCase().includes(filterText.toLowerCase()) || 
                bot.username.toLowerCase().includes(filterText.toLowerCase())
            );

            if (filtered.length === 0) {
                container.innerHTML = "<p style='color:var(--hint-color);'>No bots found.</p>";
                return;
            }

            filtered.forEach(bot => {
                const item = document.createElement('div');
                item.className = 'bot-item';
                item.innerHTML = `
                    <div class="bot-details">
                        <img src="${bot.img}" class="avatar" style="width:40px; height:40px;">
                        <div>
                            <div style="font-weight:bold;">${bot.name}</div>
                            <div style="color:var(--hint-color); font-size:0.85rem;">@${bot.username}</div>
                        </div>
                    </div>
                    <button class="btn" onclick="openBot('${bot.username}')">Open</button>
                `;
                container.appendChild(item);
            });
        }

        // Function: Telegram link open karna
        function openBot(username) {
            tg.openTelegramLink(`https://t.me{username}`);
        }

        // Search Bar Event Listener
        searchInput.addEventListener('input', (e) => {
            renderBots(e.target.value);
        });

        // Initial load
        renderBots();
    </script>
</body>
</html>
