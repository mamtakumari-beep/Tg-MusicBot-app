<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TG Music Bots Hub</title>
    <!-- Telegram Library -->
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-color: #17212b;
            --text-color: #f5f5f5;
            --card-bg: #24303f;
            --accent-color: #2481cc;
            --hint-color: #708499;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }
        .section {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: var(--accent-color);
            border-bottom: 1px solid var(--hint-color);
            padding-bottom: 8px;
        }
        /* Feature 1: User Profile */
        .user-card {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .avatar-container {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.4rem;
            color: white;
            overflow: hidden;
        }
        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .user-info p {
            margin: 4px 0;
        }
        /* Feature 2: Bot List */
        .bot-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .bot-item:last-child {
            border-bottom: none;
        }
        .bot-details {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .bot-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
        }
        .btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
        }
        /* Feature 3: Owner */
        .owner-card {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
    </style>
</head>
<body>

    <!-- Feature 1: User Details -->
    <div class="card" id="user-card">
        <h3>👤 User Details (You)</h3>
        
        <!-- 🌟 नया प्रोफाइल फोटो का सेक्शन -->
        <div class="avatar-container">
            <!-- शुरू में एक डिफ़ॉल्ट यूजर इमेज लोड होगी -->
            <img id="u-avatar" class="user-avatar" src="https://cloudflare.com" alt="User DP">
        </div>

        <p><span class="bold">Name:</span> <span id="u-name">Loading...</span></p>
        <p><span class="bold">Username:</span> <span id="u-username">Loading...</span></p>
        <p><span class="bold">ID:</span> <span id="u-id">Loading...</span></p>
        <p><span class="bold">Language:</span> <span id="u-lang">Loading...</span></p>
    </div>

    <!-- FEATURE 2: BOT LIST -->
    <div class="section">
        <h2>🤖 Music Bots List</h2>
        <div id="bots-container"></div>
    </div>

    <!-- FEATURE 3: OWNER DETAILS -->
    <div class="section">
        <h2>👑 Developer & Support</h2>
        <div class="owner-card">
            <p><strong>Owner:</strong> Niraj</p>
            <p><strong>Username:</strong> @Comeback_009</p>
            <a href="https://t.me/Sangeet_Stream" class="btn" style="text-align: center;">Contact Support</a>
        </div>
    </div>

    <script>
        // Telegram Initialization Secure Function
        window.addEventListener('DOMContentLoaded', () => {
            const tg = window.Telegram?.WebApp;
            
            if (tg) {
                tg.ready();
                tg.expand();

                // User details nikalna
                const initData = tg.initDataUnsafe;
                const user = initData?.user;

                if (user) {
                    const firstName = user.first_name || "";
                    const lastName = user.last_name || "";
                    const fullName = `${firstName} ${lastName}`.trim();
                    const username = user.username ? `@${user.username}` : 'No Username';

                    // Update UI
                    document.getElementById('user-name').innerText = fullName;
                    document.getElementById('user-username').innerText = username;

                    // Profile Pic Setup
                    const avatarBox = document.getElementById('avatar-box');
                    if (user.photo_url) {
                        avatarBox.innerHTML = `<img src="${user.photo_url}" class="avatar-img" alt="DP">`;
                    } else {
                        // Agar DP URL na mile, to naam ka pehla letter dikhao (Fallback)
                        avatarBox.innerText = firstName.charAt(0).toUpperCase();
                    }
                } else {
                    showDemoData("User data null (Try from Bot Link)");
                }
            } else {
                showDemoData("Not in Telegram Environment");
            }
        });

        function showDemoData(reason) {
            document.getElementById('user-name').innerText = "Demo Account";
            document.getElementById('user-username').innerText = "@demo_user";
            document.getElementById('avatar-box').innerText = "D";
            console.log("Status: " + reason);
        }

        // 2. Bots Data List
        const botsData = [
            { name: "laado Music Bot", username: "laado_musicbot", img: "https://unsplash.com" },
            { name: "Spotify", username: "spotifysave_bot", img: "https://unsplash.com" },
            { name: "YouTube music", username: "yt_audio_bot", img: "https://unsplash.com" },
        ];

        // Render Bots
        const container = document.getElementById('bots-container');
        botsData.forEach(bot => {
            const item = document.createElement('div');
            item.className = 'bot-item';
            item.innerHTML = `
                <div class="bot-details">
                    <img src="${bot.img}" class="bot-avatar">
                    <div>
                        <div style="font-weight:bold;">${bot.name}</div>
                        <div style="color:var(--hint-color); font-size:0.85rem;">@${bot.username}</div>
                    </div>
                </div>
                <button class="btn" onclick="openBot('${bot.username}')">Open</button>
            `;
            container.appendChild(item);
        });

        function openBot(username) {
            if (window.Telegram?.WebApp) {
                window.Telegram.WebApp.openTelegramLink(`https://t.me{username}`);
            } else {
                window.open(`https://t.me{username}`, '_blank');
            }
        }
    </script>
</body>
</html>
